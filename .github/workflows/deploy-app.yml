name: deploy-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Déploiement en production. Se déclenche à chaque push sur `main` et publie les fichiers de la
# PWA à la racine de la branche `gh-pages` (servie par GitHub Pages), sans toucher au sous-dossier
# `/preprod/` qui y vit à côté (déployé séparément par deploy-app-preprod.yml).
#
# URLs :
#   - production :      https://jeangarf.github.io/git-graph-web/
#   - pré-production :  https://jeangarf.github.io/git-graph-web/preprod/

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer le dossier à publier
        run: |
          mkdir site
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png site/

      - name: Déployer 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site # Le dossier que l'action doit publier.
          branch: gh-pages # La branche que l'action doit alimenter.
          clean: false # ne pas toucher à ce qui existe déjà (dont /preprod/)
